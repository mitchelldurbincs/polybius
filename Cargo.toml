[package]
name = "miner"
version = "0.3.0"
edition = "2021"

[dependencies]
cpal = "0.15"
hound = "3.5"
global-hotkey = "0.6"
ringbuf = "0.4"
tray-icon = "0.19"
winit = "0.30"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = true
strip = true
