[package]
name = "miner"
version = "0.4.0"
edition = "2021"

[dependencies]
cpal = "0.15"
hound = "3.5"
global-hotkey = "0.6"
ringbuf = "0.4"
tray-icon = "0.19"
winit = "0.30"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
image = "0.25"
chrono = { version = "0.4", features = ["serde"] }
softbuffer = "0.4"

[target.'cfg(windows)'.dependencies]
win-screenshot = "4"
windows = { version = "0.58", features = [
    "Win32_System_Console",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Globalization",
    "Storage_Streams",
] }

# screenshots crate requires system libraries (ALSA on Linux)
# Uncomment below for cross-platform screenshot support:
# [target.'cfg(not(windows))'.dependencies]
# screenshots = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
